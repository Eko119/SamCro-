name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/samanthas-crochet-boutique-k3rjmn
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dist/
        run: node build.mjs

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Creates the Pages project on the first run if it does not exist.
          command: >-
            pages deploy dist
            --project-name=samanthas-crochet-boutique
            --branch=${{ github.ref_name }}
